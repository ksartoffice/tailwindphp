name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  windows-compatibility:
    runs-on: windows-latest
    name: Windows PHP 7.4 compatibility
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: ctype, mbstring
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - name: Check imports, autoloading, and fork aliases
        run: php vendor/bin/phpunit --filter "ImportPathsTest|StandaloneAutoloadTest|PublicApiTest|ForkCompatibilityTest|LegacyUtilityParityTest"
